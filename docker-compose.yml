services:
  backend:
    image: frappe/erpnext:v15
    container_name: frappe-bidding-backend
    restart: unless-stopped
    working_dir: /home/frappe/frappe-bench
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
    command: >
      bash -c "bench serve --port 8000 & bench worker & bench schedule & wait"
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
      - ./apps/bidding:/home/frappe/frappe-bench/apps/bidding
    ports:
      - "8100:8000"
    depends_on:
      - db
      - redis-cache
      - redis-queue
  websocket:
    image: frappe/erpnext:v15
    container_name: frappe-bidding-ws
    restart: unless-stopped
    working_dir: /home/frappe/frappe-bench
    command: ["node", "apps/frappe/socketio.js"]
    environment:
      - DB_HOST=db
      - REDIS_CACHE=redis-cache:6379
      - REDIS_QUEUE=redis-queue:6379
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
    ports:
      - "8101:9000"
    depends_on:
      - db
      - redis-cache
      - redis-queue
  db:
    image: mariadb:10.6
    container_name: frappe-bidding-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=biddingdb2026
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - dbdata:/var/lib/mysql
  redis-cache:
    image: redis:6.2-alpine
    container_name: frappe-bidding-rc
    restart: unless-stopped
  redis-queue:
    image: redis:6.2-alpine
    container_name: frappe-bidding-rq
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - queuedata:/data
volumes:
  dbdata:
  queuedata:
